    let currentPhotoIndex = 0;
    let currentGallery = [];
    let autoSlideTimer = null;

    function updateActiveImage(index) {
      if (!currentGallery.length) return;
      currentPhotoIndex = index;

      const mainImg = document.getElementById('detail-main-img');
      if (mainImg) {
        mainImg.classList.remove('animate-fade-in');
        void mainImg.offsetWidth;
        mainImg.src = currentGallery[currentPhotoIndex];
        mainImg.classList.add('animate-fade-in');
      }

      const allThumbs = document.querySelectorAll('.thumb-item');
      allThumbs.forEach((thumb, idx) => {
        if (idx === currentPhotoIndex) {
          thumb.classList.add('border-brand-600', 'scale-105', 'opacity-100');
          thumb.classList.remove('border-transparent', 'opacity-40');
          thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          thumb.classList.remove('border-brand-600', 'scale-105', 'opacity-100');
          thumb.classList.add('border-transparent', 'opacity-40');
        }
      });
    }

    // Sinkronisasi gambar pada modal popup
    function updateModalImage() {
      const modalImg = document.getElementById('modal-img');
      if (modalImg && currentGallery.length) {
        modalImg.src = currentGallery[currentPhotoIndex];
      }
    }

    function nextImage() {
      if (!currentGallery.length) return;
      let nextIdx = (currentPhotoIndex + 1) % currentGallery.length;
      updateActiveImage(nextIdx);
    }

    function prevImage() {
      if (!currentGallery.length) return;
      let prevIdx = (currentPhotoIndex - 1 + currentGallery.length) % currentGallery.length;
      updateActiveImage(prevIdx);
    }

    function openImageModal() {
      if (!currentGallery.length) return;
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      modalImg.src = currentGallery[currentPhotoIndex];
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      stopAutoSlide();
    }

    function closeImageModal() {
      const modal = document.getElementById('image-modal');
      modal.classList.remove('flex');
      modal.classList.add('hidden');
      startAutoSlide();
    }

    function startAutoSlide() {
      stopAutoSlide();
      autoSlideTimer = setInterval(nextImage, 3500);
    }

    function stopAutoSlide() {
      if (autoSlideTimer) clearInterval(autoSlideTimer);
    }

    function resetAutoSlide() {
      stopAutoSlide();
      startAutoSlide();
    }

    function renderPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id') || "1";
      const data = portfolioDatabase[projectId] || portfolioDatabase["1"];

      if (data) {
        currentGallery = data.gallery || [];

        document.getElementById('nav-project-title').textContent = data.title;
        document.getElementById('detail-title').textContent = data.title;
        document.getElementById('detail-category').textContent = data.category;
        document.getElementById('detail-client').textContent = data.client;
        document.getElementById('detail-desc').textContent = data.description || "";
        document.getElementById('detail-overview').textContent = data.overview;
        document.getElementById('detail-challenge').textContent = data.challenge;
        document.getElementById('detail-role').textContent = data.role;

        const containerLink = document.getElementById('container-link');
        const detailLink = document.getElementById('detail-link');
        const detailLinkText = document.getElementById('detail-link-text');

        if (data.link && data.link.trim() !== "") {
          detailLink.href = data.link;
          detailLinkText.textContent = data.link;
          containerLink.style.display = "block";
        } else {
          containerLink.style.display = "none";
        }

        document.getElementById('photo-count').textContent = currentGallery.length;

        const thumbContainer = document.getElementById('detail-thumbnails');
        if (thumbContainer) {
          thumbContainer.innerHTML = '';
          currentGallery.forEach((imgUrl, idx) => {
            const img = document.createElement('img');
            img.src = imgUrl;
            img.alt = `Document Thumbnail ${idx + 1}`;
            img.className = 'thumb-item w-14 h-14 sm:w-16 sm:h-16 object-cover rounded-xl cursor-pointer border-2 transition-all flex-shrink-0 opacity-40 hover:opacity-100';
            img.addEventListener('click', () => {
              updateActiveImage(idx);
              resetAutoSlide();
            });
            thumbContainer.appendChild(img);
          });
        }

        updateActiveImage(0);
        startAutoSlide();

        const tagsContainer = document.getElementById('detail-tags');
        if (tagsContainer) {
          tagsContainer.innerHTML = '';
          data.tags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'px-3 py-1 bg-slate-100 text-slate-700 rounded-full text-xs font-bold';
            span.textContent = tag;
            tagsContainer.appendChild(span);
          });
        }

        const featuresContainer = document.getElementById('detail-features');
        if (featuresContainer) {
          featuresContainer.innerHTML = '';
          data.features.forEach(feat => {
            const li = document.createElement('li');
            li.className = 'flex items-center gap-2 py-1 font-semibold text-slate-700';
            li.innerHTML = `<i class="bi bi-check2-circle text-brand-600 text-base"></i> <span>${feat}</span>`;
            featuresContainer.appendChild(li);
          });
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPage();

      // Keyboard Shortcut: ESC untuk tutup modal, Tombol Panah Kiri/Kanan untuk geser gambar di modal
      document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('image-modal');
        const isModalOpen = modal && modal.classList.contains('flex');

        if (e.key === 'Escape') {
          closeImageModal();
        } else if (isModalOpen && e.key === 'ArrowRight') {
          nextImage();
          updateModalImage();
        } else if (isModalOpen && e.key === 'ArrowLeft') {
          prevImage();
          updateModalImage();
        }
      });
    });
  </script>
